name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Bazel Build (${{ matrix.os }}, ${{ matrix.compilation_mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        compilation_mode: [fastbuild]
        include:
          # dbg (CLion's debug mode) and opt (production) exercise build-mode-specific
          # behavior that fastbuild never does. Not platform-specific, so one OS covers both.
          - os: ubuntu-24.04
            compilation_mode: dbg
          - os: ubuntu-24.04
            compilation_mode: opt

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure git for private repo access
        run: git config --global url."https://${{ secrets.READ_PRIVATE_CRES_REPOS }}@github.com/".insteadOf "https://github.com/"

      # --- Linux: Boost, FFTW, and MatIO come from apt, which installs into locations the
      # compiler already searches (see katydid's tools/ubuntu_libs.bzl). The .deb cache key
      # rationale is in katydid's .github/workflows/ci.yaml.
      - name: Cache downloaded .deb files (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/apt/archives
          key: apt-archives-${{ hashFiles('.github/workflows/ci.yaml') }}

      - name: Install Boost/FFTW/MatIO runtime deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libboost-filesystem-dev \
            libboost-thread-dev \
            libboost-date-time-dev \
            libboost-program-options-dev \
            libfftw3-dev \
            libmatio-dev \
            libtbb12 \
            libblas3
          # apt's root-owned lock and partial/ are unreadable by the runner user and fail the
          # post-job cache save ("Permission denied"). Only the .deb files belong in the cache.
          sudo rm -f /var/cache/apt/archives/lock
          sudo rm -rf /var/cache/apt/archives/partial

      # --- macOS: Boost, FFTW, and MatIO are large enough downloads to be worth caching.
      - name: Cache Homebrew downloads (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-cache-${{ runner.os }}
          restore-keys: |
            brew-cache-${{ runner.os }}

      - name: Install Boost/FFTW/MatIO (macOS)
        if: runner.os == 'macOS'
        run: brew install boost fftw libmatio

      - name: Set up Bazel & Caching
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          # The ubuntu-24.04 variants would otherwise share one disk-cache key (scoped by
          # platform/arch) and race to save it, so only one persists. This gives each
          # compilation mode its own.
          cache-version: ${{ matrix.compilation_mode }}

      - name: Verify MODULE.bazel.lock is up to date and build everything
        run: bazel build -c ${{ matrix.compilation_mode }} --@pypi//venv=dev //...

      - name: Test everything
        run: bazel test -c ${{ matrix.compilation_mode }} //...

  # A separate job: an empty `container:` in a matrix can fail workflow validation
  # (https://github.com/actions/runner/issues/265).
  build-and-test-almalinux:
    name: Bazel Build (almalinux-9)
    runs-on: ubuntu-latest
    container:
      image: almalinux:9

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # keepcache=True below is needed for this cache to help: dnf deletes downloaded packages
      # after install by default. Keyed on this file's hash, like the .deb cache above.
      - name: Cache dnf packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/dnf
          key: dnf-cache-almalinux9-${{ hashFiles('.github/workflows/ci.yaml') }}

      # gcc-c++ and git (for fetching this repo's dependencies) are absent from the minimal
      # image. Bazel fetches everything else from pinned AlmaLinux and EPEL archives (katydid's
      # tools/almalinux_libs.bzl); cpio unpacks them, and rpm2cpio ships with the base image.
      - name: Install build tools (dnf)
        run: |
          dnf install -y --setopt=keepcache=True \
            gcc-c++ \
            git \
            wget \
            tar \
            cpio

      - name: Configure git for private repo access
        run: git config --global url."https://${{ secrets.READ_PRIVATE_CRES_REPOS }}@github.com/".insteadOf "https://github.com/"

      # setup-bazel's Bazel installer is unreliable in this minimal image.
      - name: Install Bazelisk directly
        run: |
          wget -q -O /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazel

      # Caches the Bazel binary Bazelisk downloads; setup-bazel's caching is unreliable in this
      # container.
      - name: Cache Bazelisk's downloaded Bazel binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /root/.cache/bazelisk
          key: bazelisk-cache-almalinux9-${{ hashFiles('.bazelversion') }}

      - name: Set up Bazel & Caching
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          # The container changes what executes, not what the runner reports, so this job's
          # disk-cache key (scoped by platform/arch) collides with the ubuntu-24.04 jobs'.
          # Cache keys are immutable once written, so a colliding save locks in whichever
          # content lands first (~5 MB disk / ~0 MB repository, forcing a full recompile).
          # cache-version gives this job its own slot.
          cache-version: almalinux9

      - name: Verify MODULE.bazel.lock is up to date and build everything
        run: bazel build --@pypi//venv=dev //...

      - name: Test everything
        run: bazel test --@pypi//venv=dev //...

  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: Cache Pre-Commit Hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install Pre-Commit Framework
        run: pip install pre-commit

      - name: Execute Format Validations
        run: pre-commit run --all-files
