name: Renovate Bazel Lockfile Sync

on:
  pull_request_target:
    types: [opened, synchronize]
    paths:
      - "MODULE.bazel"
      - ".bazelrc"
      - ".bazelversion"

jobs:
  update-bazel-lockfile:
    # Only run on PRs opened or updated by Renovate
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          # Requires a PAT or App Token with repo write permissions
          token: ${{ secrets.PAT_WITH_WRITE_ACCESS }}

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0

      - name: Sync MODULE.bazel.lock
        run: bazel mod deps --lockfile_mode=update

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODULE.bazel.lock
          git diff-index --quiet HEAD || (git commit -m "chore(bazel): update MODULE.bazel.lock" && git push)
