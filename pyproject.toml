[project]
name = "rocks-analysis-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argparse>=1.4.0",
    "awkward-pandas>=2023.8.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.0",
    "numpy>=2.5.2",
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pytz>=2026.3.post1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tyro>=1.0.15",
    "uproot>=5.7.4",
]

[dependency-groups]
dev = [
    "argparse>=1.4.0",
    "awkward-pandas>=2023.8.0",
    "build>=1.5.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.0",
    "numpy>=2.5.2",
    "pandas>=3.0.3",
    "pandas-stubs>=3.0.3.260530",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pytz>=2026.3.post1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "setuptools>=82.0.1",
    "tyro>=1.0.15",
    "uproot>=5.7.4",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"
exclude = []

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "TCH", # flake8-type-checking
    "UP", # pyupgrade
]
ignore = [
    "E501",  # Long line length -> let the formatter do the right thing but don't lint what it leaves
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["typer.Typer.command", "app.command"]
