syntax = "proto3";

package com.github.helium6cres.rocks_analysis_pipeline.api.v1;

import "rocks_analysis_pipeline/api/v1/task_identity.proto";

option go_package = "github.com/Helium6CRES/rocks_analysis_pipeline/api/v1";

// DMTrack matches one row of dmtracks.csv -- one downmixed track
// segment, produced by DMTrackBuilder. Fields are column-for-column with
// the per-task dmtracks.csv (38 columns). The per-task file carries no
// identity columns -- TaskIdentity, on the wrapping DMTrackList below,
// supplies that.
//
// track_num, event_num, beta_num, acq_num, and trap_acq_num are all
// `double`, not an integer type, even though every sample value ends in
// ".0": he6-cres-spec-sims computes them as floats. trap_acq_num comes
// from ExB.trap_cycle_index, a floor division of two floats, which
// Python/NumPy returns as a float even though the result is always
// integer-*valued* ("returns integer values >= -1"). acq_num starts as
// np.nan in an earlier, pre-trapping intermediate representation
// (EventBuilder's construct_untrapped_track_df) before TrackBuilder
// overwrites it with a value from a dtype=int RNG draw, but a pandas
// column that has held NaN stays upcast to float64, consistent with
// these five columns printing with a trailing ".0" while bands.csv's
// event/track/band columns print as plain integers.
message DMTrack {
  double energy = 1;
  double gamma = 2;
  double end_energy = 3;
  double initial_rho_pos = 4;
  double initial_phi_pos = 5;
  double initial_zpos = 6;
  double initial_theta = 7;
  double cos_initial_theta = 8;
  double initial_phi_dir = 9;
  double center_theta = 10;
  double cos_center_theta = 11;
  double initial_field = 12;
  double initial_radius = 13;
  double center_x = 14;
  double center_y = 15;
  double rho_center = 16;
  double trapped_initial_theta = 17;
  double max_radius = 18;
  double min_radius = 19;
  double b_avg = 20;
  double start_freq = 21;
  double end_freq = 22;
  double start_time = 23;
  double end_time = 24;
  double start_time_in_trap_acq = 25;
  double end_time_in_trap_acq = 26;
  double zmax = 27;
  double axial_freq = 28;
  double grad_b_freq = 29;
  double mod_index = 30;
  double track_power = 31;
  double slope = 32;
  double track_length = 33;
  double track_num = 34;
  double event_num = 35;
  double beta_num = 36;
  double acq_num = 37;
  double trap_acq_num = 38;
}

// DMTrackList is stage 1's dmtracks_proto_done output: every DMTrack row
// from one task's dmtracks.csv, plus the TaskIdentity those rows share.
message DMTrackList {
  TaskIdentity task = 1;
  repeated DMTrack dmtracks = 2;
}

// DMTrackLists is stage 2's merge-step output: every task's DMTrackList
// for one run, gathered as-is; nothing is flattened, so each entry keeps
// its TaskIdentity and no per-row identity needs duplicating.
message DMTrackLists {
  repeated DMTrackList dmtrack_lists = 1;
}
