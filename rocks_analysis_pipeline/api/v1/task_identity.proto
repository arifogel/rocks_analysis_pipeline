syntax = "proto3";

package com.github.helium6cres.rocks_analysis_pipeline.api.v1;

option go_package = "github.com/Helium6CRES/rocks_analysis_pipeline/api/v1";

// TaskIdentity identifies which stage-1 task -- run_name, subrun_id,
// field_index, and true_field -- a batch of records came from. true_field
// is included since nothing else records it once a task's specsims.yaml
// is deleted during cleanup.
//
// Carried once per file, on each *List wrapper message (BandList,
// DMTrackList, TrackList, SlewTimesList), not repeated on every individual
// row: every row produced by one task shares the exact same identity.
// Stage 2's merge step gathers each *List message as-is into a *Lists
// wrapper (BandLists, DMTrackLists, TrackLists), with its TaskIdentity
// traveling along unchanged -- nothing is flattened, and nothing needs
// propagating onto individual rows.
//
// acquisition is absent: fixed at 0, so there is nothing to distinguish.
message TaskIdentity {
  string run_name = 1;
  int32 subrun_id = 2;
  int32 field_index = 3;
  double true_field = 4;
}
