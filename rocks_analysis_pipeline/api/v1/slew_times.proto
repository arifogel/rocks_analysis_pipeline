syntax = "proto3";

package com.github.helium6cres.rocks_analysis_pipeline.api.v1;

import "rocks_analysis_pipeline/api/v1/task_identity.proto";

option go_package = "github.com/Helium6CRES/rocks_analysis_pipeline/api/v1";

// SlewTimes matches one row of Katydid's rf-slew-to-vec ("stv") processor
// output -- the trap-clearing (ExB) voltage-on/off window boundaries for
// one cycle, read out of a plain "Time_On,Time_Off" text file. Not a ROOT
// branch, so there is no C++ type to check field types against, but
// every sample value is plainly fractional, so double is unambiguous.
message SlewTimes {
  double time_on = 1;
  double time_off = 2;
}

// SlewTimesList is stage 1's slew_proto_done output: every SlewTimes row
// from one task's _SlewTimes.txt, plus the TaskIdentity those rows share.
message SlewTimesList {
  TaskIdentity task = 1;
  repeated SlewTimes slew_times = 2;
}
