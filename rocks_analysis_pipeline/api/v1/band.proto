syntax = "proto3";

package com.github.helium6cres.rocks_analysis_pipeline.api.v1;

import "rocks_analysis_pipeline/api/v1/task_identity.proto";

option go_package = "github.com/Helium6CRES/rocks_analysis_pipeline/api/v1";

// Band matches one row of bands.csv (Band.to_dict() in
// he6-cres-spec-sims) -- one frequency sub-band of one track segment,
// produced by SideBandBuilder. Fields are column-for-column with the
// per-task bands.csv: acquisition, start_time, start_freq, end_time,
// end_freq, power, event, track, band. The per-task file carries no
// identity columns -- TaskIdentity, on the wrapping BandList below,
// supplies that.
message Band {
  int32 acquisition = 1;
  double start_time = 2;
  double start_freq = 3;
  double end_time = 4;
  double end_freq = 5;
  double power = 6;
  int32 event = 7;
  int32 track = 8;
  int32 band = 9;  // signed: negative/positive sideband order relative to the carrier
}

// BandList is stage 1's bands_proto_done output: every Band row from one
// task's bands.csv, plus the TaskIdentity those rows share.
message BandList {
  TaskIdentity task = 1;
  repeated Band bands = 2;
}

// BandLists is stage 2's merge-step output: every task's BandList for one
// run, gathered as-is. Nothing is flattened, so each entry keeps its
// TaskIdentity and no per-row identity needs duplicating.
message BandLists {
  repeated BandList band_lists = 1;
}
