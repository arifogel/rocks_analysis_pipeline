syntax = "proto3";

package com.github.helium6cres.rocks_analysis_pipeline.api.v1;

import "rocks_analysis_pipeline/api/v1/task_identity.proto";

option go_package = "github.com/Helium6CRES/rocks_analysis_pipeline/api/v1";

// Event matches one reconstructed multi-band event, read directly from
// Katydid's .root output (f["MB-events"]["MultiBandEvent"]["fTracks"],
// the KTMultiBandEventData class's per-event tracks), not from an
// intermediate CSV, so field types here match the real ROOT branch types
// (UInt_t/Int_t/Double_t). The CSV-based pipeline loses this distinction:
// every one of the six integer fields below prints with a misleading
// ".0" suffix in tracks.csv, an artifact of pandas silently promoting a
// mixed dataframe's columns to float64, not anything true about the
// underlying data.
//
// Named Event, not Track: this is the same data the CSV-based pipeline's
// tracks.csv held, read from the same "MB-events"/MultiBandEvent/fTracks
// path, but "tracks.csv" was a misnomer -- this is one row per
// reconstructed event (EventId/EventType/BandNumber, the multi-band
// event builder's output), not a standalone track listing. Per-point
// track data comes from a different ROOT tree entirely ("tracks", not
// "MB-events").
//
// Two fields present in the real ROOT branches (and in tracks.csv) are
// omitted: UniqueID and Bits. These come from ROOT's TObject base class,
// which the underlying ROOT class inherits from -- internal
// object-bookkeeping fields, not anything Katydid computed about the
// event, with no physics meaning.
message Event {
  uint32 track_id = 1;
  uint32 event_id = 2;
  int32 band_number = 3;    // signed: real data has negative sideband numbers
  uint32 event_type = 4;
  double axial_freq = 5;
  int32 num_points = 6;
  double start_frequency = 7;
  double end_frequency = 8;
  double freq_length = 9;
  double start_time_in_run_c = 10;
  double end_time_in_run_c = 11;
  double time_length = 12;
  double start_time_in_acq_c = 13;
  double end_time_in_acq_c = 14;
  int32 start_acq_id = 15;
  double acq_freq_intercept = 16;
  double bulk_slope = 17;
  double mean_local_slope = 18;
  double max_local_slope = 19;
  double min_local_slope = 20;
  double std_dev_local_slope = 21;
  double total_nsp = 22;
  double mean_nsp = 23;
  double max_nsp = 24;
  double min_nsp = 25;
  double std_dev_nsp = 26;
  double total_power = 27;
  double mean_power = 28;
  double max_power = 29;
  double min_power = 30;
  double std_dev_power = 31;
  double manhattan_length = 32;
  double density = 33;
  double nsp_per_unit_length = 34;
  double density_est_snr = 35;
  double mle_power_snr = 36;
}

// EventList is stage 1's events_proto_done output: every Event from one
// task's Katydid .root file, plus the TaskIdentity those events share.
message EventList {
  TaskIdentity task = 1;
  repeated Event events = 2;
}

// EventLists is stage 2's merge-step output: every task's EventList for
// one run, gathered as-is; nothing is flattened, so each entry keeps its
// TaskIdentity and no per-row identity needs duplicating.
message EventLists {
  repeated EventList event_lists = 1;
}
