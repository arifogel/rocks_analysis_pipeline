syntax = "proto3";

package com.github.helium6cres.rocks_analysis_pipeline.api.v1;

option go_package = "github.com/Helium6CRES/rocks_analysis_pipeline/api/v1";

// TaskIdentity identifies which stage-1 task -- run_name, subrun_id,
// field_index, and (since it exists nowhere else once specsims.yaml is
// cleaned up, see stage1_state.py's own STEP_MC_TRUTH_DELETED /
// STEP_KATYDID_OUTPUT_DELETED) true_field -- a batch of records came from.
//
// Carried once per file (on each *List wrapper message: BandList,
// DMTrackList, TrackList, SlewTimesList), not repeated on every individual
// row: every row produced by one task shares the exact same identity, so
// repeating it per row would be pure waste. This is not the same problem
// root_files.csv's own bridge table solved (see this repo's own commit
// history): it isn't a separate manifest file to join against -- stage 2's
// merge step just needs to read each file's own TaskIdentity once and
// propagate it onto each row as it flattens many files together, a
// trivial, local operation.
//
// acquisition is deliberately absent: fixed at 0 from here onward (see
// stage1_state.py's own module doc comment), so there is nothing to
// distinguish.
message TaskIdentity {
  string run_name = 1;
  int32 subrun_id = 2;
  int32 field_index = 3;
  double true_field = 4;
}
